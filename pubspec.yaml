name: service_ops_a_i
description: ServiceOps AI - Industrial Field Service Mobile App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_size_text: ^3.0.0
  cached_network_image: ^3.3.1
  collection: ^1.18.0
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.7.0
  from_css_color: ^2.0.0
  go_router: ^12.1.3
  google_fonts: ^6.1.0
  intl: ^0.19.0
  lottie: ^3.1.0
  page_transition: ^2.1.0
  percent_indicator: ^4.2.3
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  timeago: ^3.6.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/
    - assets/jsons/
    - assets/screenshots/
